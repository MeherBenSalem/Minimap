# Publish Remnants Minimap to CurseForge (NightBeam convention: CurseForge only since 24 Nov 2026).
#
# Runs only by hand (workflow_dispatch) or on a v*.*.* tag; a push to main never releases anything.
# Uses exactly the 8 convention jars for the version, in this order of sources:
#   1. releases/remnantminimaps-<loader>-<minecraft>-<version>.jar committed to the repo (none are today),
#   2. the jars attached to the GitHub Release v<version>,
#   3. a build from source: ./gradlew buildAll (the workspaces and VERSION must be at <version>).
# The run fails unless all 8 are found: 1.20.1 Fabric + Forge; 1.21.1, 26.2 and 26.3 Fabric + NeoForge.
# scripts/upload_platforms.mjs reads loader + Minecraft version from each jar name, uploads it with Fabric API as a
# required dependency on Fabric, and takes the release notes from this version's section of CHANGELOG.md.
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if this mod already had a
# release today (Africa/Tunis day), on CurseForge or in an earlier Publish run. A dry run only reports it.
# It runs before building and again right before the upload, whatever the inputs below say.
#
# Repo secrets: CURSEFORGE_TOKEN (upload token), CURSEFORGE_API_KEY (Core API key, for the same-day guard)
# Repo variable: CURSEFORGE_ID (1564458); the workflow falls back to this ID if the variable is unset
# The existing Modrinth project stays up as it is but gets no new versions.
#
# Prove it first:  gh workflow run publish.yml -f version=2.1.1 -f dry_run=true
# Release:         gh workflow run publish.yml -f version=2.1.1   (or: git tag v2.1.1 && git push origin v2.1.1)

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging; matches jar names / GitHub Release
        required: false
      dry_run:
        description: Skip uploads if true
        type: choice
        options: ["false", "true"]
        default: "false"
      minecraft_version:
        description: "Optional: upload only these Minecraft versions (comma-separated: 1.20.1, 1.21.1, 26.2, 26.3); the same-day guard still applies"
        required: false

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION_INPUT" ]]; then
            echo "version=${VERSION_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test publisher scripts
        run: node --test scripts/*.test.mjs

      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1564458' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the 8 convention names are ever picked up; anything else for this version is ignored.
          mapfile -t NAMES < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          found=0
          for name in "${NAMES[@]}"; do
            if [ -f "releases/$name" ]; then
              cp -f "releases/$name" dist/
              found=$((found + 1))
            fi
          done
          if [ "$found" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $found prebuilt jar(s) from releases/"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No convention jars for ${VERSION} in releases/; will try the GitHub Release, then build from source"
          fi

      - name: Download GitHub release jars
        id: ghrelease
        if: steps.prebuilt.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          patterns=()
          while IFS= read -r name; do patterns+=(--pattern "$name"); done < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "v${VERSION}" --repo "${{ github.repository }}" --dir dist --clobber "${patterns[@]}" || true
          fi
          count=$(find dist -maxdepth 1 -name 'remnantminimaps-*.jar' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $count jar(s) from GitHub Release v${VERSION}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub Release jars for v${VERSION}; building from source"
          fi

      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'

      - name: Build from source
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Also fails if VERSION differs from the workspaces.
          python3 scripts/check_targets.py workspaces
          ws_version="$(python3 scripts/check_targets.py version)"
          if [ "$ws_version" != "$VERSION" ]; then
            echo "::error::The workspaces are at ${ws_version}, not ${VERSION}. Bump them first (./gradlew syncVersion -PmodVersion=${VERSION})."
            exit 1
          fi
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
          python3 scripts/check_targets.py jars --version "$VERSION" --dir releases --list-file built-jars.txt
          mkdir -p dist
          xargs -a built-jars.txt cp -f -t dist/

      - name: Verify release jars
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC_FILTER: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          # Exactly the 8 convention jars, one per loader + Minecraft pair, or the run stops here.
          python3 scripts/check_targets.py jars --version "$VERSION" --dir dist --list-file jar-list.txt
          # Preview what the upload step will send (no tokens here, so no network call).
          args=(--version "$VERSION" --jar-dir dist --dry-run)
          [ -n "$MC_FILTER" ] && args+=(--games "$MC_FILTER")
          node scripts/upload_platforms.mjs "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*.jar

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1564458' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1564458' }}
          VERSION: ${{ steps.ver.outputs.version }}
          MC_FILTER: ${{ inputs.minecraft_version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_ID:-}" || { echo "Set the repo variable CURSEFORGE_ID" >&2; exit 1; }
          args=(--version "$VERSION" --jar-dir dist)
          [ -n "$MC_FILTER" ] && args+=(--games "$MC_FILTER")
          node scripts/upload_platforms.mjs "${args[@]}"
